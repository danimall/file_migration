<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>filemig — Dropbox → Google Drive</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --panel-2: #1e2229; --border: #2a2f3a;
      --text: #e7eaf0; --muted: #98a2b3; --accent: #5b8cff; --accent-2: #7c5cff;
      --ok: #36d399; --warn: #fbbd23; --err: #f87272; --dbx: #0061ff; --gdrive: #1fa463;
      --radius: 10px; --mono: ui-monospace, "SF Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    a { color: var(--accent); text-decoration: none; }
    header.top {
      display: flex; align-items: center; gap: 14px; padding: 18px 28px;
      border-bottom: 1px solid var(--border); background: var(--panel);
      position: sticky; top: 0; z-index: 10;
    }
    header.top .logo { font-weight: 700; letter-spacing: -0.02em; font-size: 18px; }
    header.top .flow { color: var(--muted); font-size: 13px; }
    header.top .spacer { flex: 1; }
    main { max-width: 1100px; margin: 0 auto; padding: 28px; }
    .grid { display: grid; gap: 20px; }
    @media (min-width: 820px) { .grid.two { grid-template-columns: 1fr 1fr; } }
    .panel {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
    }
    .panel h2 { margin: 0 0 14px; font-size: 14px; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
    .row { display: flex; align-items: center; gap: 10px; }
    .row.between { justify-content: space-between; }
    .btn {
      display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
      background: var(--accent); color: white; border: none; padding: 9px 15px;
      border-radius: 8px; font-size: 14px; font-weight: 600; transition: .15s;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
    .btn.danger { background: var(--err); }
    .btn.ok { background: var(--ok); color: #07150f; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
      border-radius: 99px; font-size: 12px; font-weight: 600;
      background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
    }
    .badge.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
    .badge.off { color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 99px; background: currentColor; }
    .state { font-family: var(--mono); font-size: 12px; padding: 2px 8px; border-radius: 6px;
      background: var(--panel-2); border: 1px solid var(--border); }
    .state.verified, .state.done { color: var(--ok); }
    .state.dead, .state.failed { color: var(--err); }
    .state.downloading, .state.uploading, .state.verifying { color: var(--accent); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    td.num, th.num { text-align: right; font-family: var(--mono); }
    .meter { height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
    .meter > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
    .muted { color: var(--muted); }
    .pill-dbx { color: var(--dbx); }
    .pill-gdrive { color: var(--gdrive); }
    .stat { display: flex; flex-direction: column; gap: 2px; }
    .stat .v { font-size: 22px; font-weight: 700; font-family: var(--mono); }
    .stat .k { font-size: 12px; color: var(--muted); }
    .stats { display: flex; gap: 28px; flex-wrap: wrap; }
    .note { font-size: 13px; color: var(--muted); padding: 10px 12px; background: var(--panel-2);
      border-radius: 8px; border: 1px solid var(--border); }
    .warn-note { border-color: color-mix(in srgb, var(--warn) 40%, transparent); color: var(--warn); }
    form { margin: 0; }
    .htmx-indicator { opacity: 0; transition: opacity .15s; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
    .tree .twisty { cursor: pointer; }
    input[type=checkbox]:disabled { opacity: .55; }
  </style>
</head>
<body>
  <header class="top">
    <span class="logo">filemig</span>
    <span class="flow"><span class="pill-dbx">Dropbox</span> → <span class="pill-gdrive">Google Drive</span></span>
    <span class="spacer"></span>
    <span class="badge"><span class="dot"></span> verify-before-delete</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
